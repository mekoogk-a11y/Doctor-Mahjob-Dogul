<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1877F2"/>
      <stop offset="100%" stop-color="#0C2D57"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle with safe zone padding -->
  <rect width="512" height="512" rx="108" fill="url(#brandGrad)"/>

  <!-- Subtle Islamic 8-Pointed Star Lattice in Background -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="2" fill="none">
    <circle cx="256" cy="256" r="210"/>
    <rect x="106" y="106" width="300" height="300" transform="rotate(45 256 256)"/>
    <rect x="106" y="106" width="300" height="300"/>
    <circle cx="256" cy="256" r="150"/>
  </g>

  <!-- Central Islamic Star Geometry & Open Book (Knowledge) Symbol -->
  <g transform="translate(256, 230)" filter="url(#glow)">
    <!-- 8-Pointed Star Accent ring -->
    <path d="M0 -115 L32 -78 L81 -81 L78 -32 L115 0 L78 32 L81 81 L32 78 L0 115 L-32 78 L-81 81 L-78 32 L-115 0 L-78 -32 L-81 -81 L-32 -78 Z"
          fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round" opacity="0.9"/>
    
    <!-- Open Book of Knowledge Leaves -->
    <!-- Left Page -->
    <path d="M-6 -25 C-35 -50 -85 -45 -100 -40 C-102 -39 -104 -37 -104 -35 L-104 55 C-104 57 -102 59 -100 58 C-85 54 -38 50 -6 68 Z"
          fill="#FFFFFF" fill-opacity="0.95"/>
    <!-- Right Page -->
    <path d="M6 -25 C35 -50 85 -45 100 -40 C102 -39 104 -37 104 -35 L104 55 C104 57 102 59 100 58 C85 54 38 50 6 68 Z"
          fill="#FFFFFF" fill-opacity="0.95"/>
    
    <!-- Spine / Center Pillar -->
    <line x1="0" y1="-22" x2="0" y2="70" stroke="#1877F2" stroke-width="4" stroke-linecap="round"/>

    <!-- Crescent of Light / Dawn of Knowledge -->
    <path d="M-40 -65 C-10 -90 35 -75 45 -45 C30 -58 0 -58 -20 -48 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Modern Platform Typography Monogram at bottom -->
  <text x="256" y="420" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" letter-spacing="4">LEARN ISLAM</text>
  <text x="256" y="450" text-anchor="middle" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="16" letter-spacing="2">DR. MAHJOB DOGUL</text>
</svg>
